<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Keep the original warm cream and charcoal palette. -->
  <circle cx="512" cy="512" r="460" fill="#FFF8F0" stroke="#3D3D3D" stroke-width="20"/>

  <g transform="translate(0 30)">
  <!-- Soft, rounded ears behind the head. -->
  <path d="M286 342 Q208 266 205 135 Q204 107 229 120 Q350 180 395 264 Z"
        fill="#FFF8F0" stroke="#3D3D3D" stroke-width="22" stroke-linejoin="round"/>
  <path d="M738 342 Q816 266 819 135 Q820 107 795 120 Q674 180 629 264 Z"
        fill="#FFF8F0" stroke="#3D3D3D" stroke-width="22" stroke-linejoin="round"/>
  <path d="M259 251 Q238 201 239 165 Q303 200 344 249 Z" fill="#3D3D3D" opacity="0.15"/>
  <path d="M765 251 Q786 201 785 165 Q721 200 680 249 Z" fill="#3D3D3D" opacity="0.15"/>

  <!-- Chubby kitten head. -->
  <path d="M512 226 C322 226 214 348 224 535 C232 691 337 785 512 785 C687 785 792 691 800 535 C810 348 702 226 512 226 Z"
        fill="#FFF8F0" stroke="#3D3D3D" stroke-width="22" stroke-linejoin="round"/>

  <!-- Small forehead tuft. -->
  <path d="M454 250 Q476 294 512 253 Q548 294 570 250"
        fill="none" stroke="#3D3D3D" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Large friendly eyes. -->
  <ellipse cx="389" cy="480" rx="49" ry="58" fill="#3D3D3D"/>
  <ellipse cx="635" cy="480" rx="49" ry="58" fill="#3D3D3D"/>
  <circle cx="373" cy="459" r="16" fill="#FFF8F0"/>
  <circle cx="619" cy="459" r="16" fill="#FFF8F0"/>
  <circle cx="404" cy="506" r="8" fill="#FFF8F0" opacity="0.85"/>
  <circle cx="650" cy="506" r="8" fill="#FFF8F0" opacity="0.85"/>

  <!-- Cheeks. -->
  <ellipse cx="325" cy="574" rx="55" ry="25" fill="#3D3D3D" opacity="0.12"/>
  <ellipse cx="699" cy="574" rx="55" ry="25" fill="#3D3D3D" opacity="0.12"/>

  <!-- Tiny nose and smiling mouth. -->
  <path d="M488 551 Q512 535 536 551 Q532 578 512 581 Q492 578 488 551 Z" fill="#3D3D3D"/>
  <path d="M512 579 C508 616 463 620 454 588 M512 579 C516 616 561 620 570 588"
        fill="none" stroke="#3D3D3D" stroke-width="12" stroke-linecap="round"/>

  <!-- Short whiskers stay readable at menu-bar sizes. -->
  <path d="M356 557 L245 530 M352 590 L237 596 M668 557 L779 530 M672 590 L787 596"
        fill="none" stroke="#3D3D3D" stroke-width="10" stroke-linecap="round"/>

  <!-- Two little paws peeking over the bottom edge. -->
  <path d="M344 730 C343 673 383 645 430 666 C469 684 471 742 438 775"
        fill="#FFF8F0" stroke="#3D3D3D" stroke-width="20" stroke-linecap="round"/>
  <path d="M680 730 C681 673 641 645 594 666 C555 684 553 742 586 775"
        fill="#FFF8F0" stroke="#3D3D3D" stroke-width="20" stroke-linecap="round"/>
  <path d="M386 704 L383 733 M421 704 L418 733 M638 704 L641 733 M603 704 L606 733"
        stroke="#3D3D3D" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
